<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Commu-nect</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body>
    
    <header class="top-nav fixed">
        <div class="logo-area">
            <div class="logo-icon">C</div>
            <div class="logo-text">
                <strong>Commu-nect</strong><br>
                <span>Gen T. De Leon</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="community-network.html">Community Network</a>
            <a href="announcement.html" class="active">Announcement</a>
            <a href="request-forms.html">Request Forms</a>
            <a href="#" onclick="logoutUser(event)" style="color: #FFCDD2; font-weight: 600;">Logout</a>
        </nav>
    </header>
    
    <div class="content-header">Announcement</div>

    <div id="base"></div>

    <script type="module">
        import { collection, doc, addDoc, getDoc, getDocs, updateDoc, query, orderBy, Timestamp, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        
        import { auth, db } from "./js/firebase.js";

        async function readValue() {
            const colRef = collection(db, "announcements");
            const q = query(colRef, orderBy("createdAt", "desc"));
            const colSnap = await getDocs(q);
            
            const col = [];
            colSnap.forEach(doc => {
                const data = doc.data();
                col.push({
                    id: doc.id,
                    title: data.title,
                    content: data.content,
                    votes: data.votes,
                    comments: data.comments
                });
            });

            return col;
        }

        let msgDB = await readValue();

        const base = document.getElementById('base');

        async function vote (annID, voteValue) {
            const user = auth.currentUser;

            const docRef = doc(db, "announcements", annID);
            const docSnap = await getDoc(docRef);

            let data = docSnap.data();
            let voters = data.voters || [];

            const existingVoteIndex = voters.findIndex(v => v.uid === user.uid);

            if (existingVoteIndex > -1) {
                await updateDoc(docRef, { votes: increment(-voters[existingVoteIndex]['vote']) });
                if (voters[existingVoteIndex]['vote'] == voteValue) {
                    voters[existingVoteIndex]['vote'] = 0;
                    voteValue = 0;
                } else {
                    voters[existingVoteIndex]['vote'] = voteValue;
                }
            } else {
                voters.push({ uid: user.uid, vote: voteValue });
            }

            await updateDoc(docRef, { votes: increment(voteValue), voters: voters });
            const retSnap = await getDoc(docRef);
            data = docSnap.data();
                
            return user.uid;
        }

        async function updateVote (annID) {
            const user = auth.currentUser;
            const docRef = doc(db, "announcements", annID);
            const docSnap = await getDoc(docRef);
            let data = docSnap.data();
            let voters = data.voters || [];

            let newVote = data['votes'];
            const voteSpan = document.getElementById(`vote-${annID}`);
            voteSpan.innerText = newVote;
            
            const upVote = document.getElementById(`up-${annID}`);
            const downVote = document.getElementById(`down-${annID}`);

            const existingVoteIndex = voters.findIndex(v => v.uid === user.uid);
            let voteValue = 0;
            if (existingVoteIndex > -1) {
                voteValue = voters[existingVoteIndex]['vote'];
            }

            if (voteValue == 1) {
                upVote.className = "icon red";
                downVote.className = "icon";
            } else if (voteValue == -1) {
                upVote.className = "icon";
                downVote.className = "icon blue";
            } else {
                upVote.className = "icon";
                downVote.className = "icon";
            }
        }

        function createDiv (msgData) {
            let newDiv = document.createElement('div');
            newDiv.className = "content";

            let newText = document.createElement('p');
            newText.className = "title";
            newText.innerText = `${msgData['title']}`;
            newDiv.appendChild(newText);

            newText = document.createElement('p');
            newText.className = "body";
            newText.innerText = `${msgData['content']}`;
            newDiv.appendChild(newText);

            let newImg = document.createElement('img');
            newImg.src = `media/images/announcement/random.jpg`; 
            newImg.className = "img";
            newDiv.appendChild(newImg);

            let lineBreak = document.createElement('br');
            newDiv.appendChild(lineBreak);

            newText = document.createElement('p');
            newText.className = "feedback";

            newImg = document.createElement('img');
            newImg.src = "media/images/icons/up arrow.svg";
            newImg.className = "icon";
            newImg.id = `up-${msgData.id}`;
            newImg.addEventListener('click', async () => {
                await vote(msgData.id, 1);
                updateVote(msgData.id);
            });
            newText.appendChild(newImg);

            let newSpan = document.createElement('span');
            newSpan.className = "vote-count";
            newSpan.id = `vote-${msgData.id}`;
            newSpan.innerText = `${msgData['votes']}`;
            newText.appendChild(newSpan);

            newImg = document.createElement('img');
            newImg.src = "media/images/icons/down arrow.svg";
            newImg.className = "icon";
            newImg.id = `down-${msgData.id}`;
            newImg.addEventListener('click', async () => {
                await vote(msgData.id, -1);
                updateVote(msgData.id);
            });
            newText.appendChild(newImg);

            newImg = document.createElement('img');
            newImg.src = "media/images/icons/message.svg";
            newImg.className = "icon";
            newImg.addEventListener('click', async () => {
                let docBody = document.body;
                let overlay = document.createElement('div');

                let darkBG = document.createElement('div');
                darkBG.className = "dark-overlay";
                darkBG.addEventListener('click', () => {
                    document.body.removeChild(overlay);
                });
                overlay.appendChild(darkBG);

                let commentBox = document.createElement('div');
                commentBox.className = "comment-box";
                overlay.appendChild(commentBox);

                let iconSection = document.createElement('div');
                iconSection.className = "icon-section";

                let closeIcon = document.createElement('img');
                closeIcon.src = "media/images/icons/close.svg";
                closeIcon.className = "icon";
                closeIcon.addEventListener('click', () => {
                    document.body.removeChild(overlay);
                });
                iconSection.appendChild(closeIcon);

                commentBox.appendChild(iconSection);

                let commentSection = document.createElement('div');
                commentSection.className = "comment-section";

                let commentPost = document.createElement('div');
                commentPost.className = "comment-post";
                commentSection.appendChild(commentPost);

                
                async function loadComments() {
                    const msgRef = doc(db, "announcements", msgData.id);
                    const msgSnap = await getDoc(msgRef);
                    const msgDataFull = msgSnap.data();

                    let comments = msgDataFull.comments || [];
                    comments.sort((a, b) => a.createdAt.toMillis() - b.createdAt.toMillis());

                    comments.forEach(comment => {
                        let commentDiv = document.createElement('div');
                        commentDiv.className = "comment";

                        let commentName = document.createElement('span');
                        commentName.className = "comment-name";
                        commentName.innerText = comment.name;
                        commentDiv.appendChild(commentName);

                        let commentText = document.createElement('p');
                        commentText.className = "comment-text";
                        commentText.innerText = comment.text;
                        commentDiv.appendChild(commentText);

                        commentPost.appendChild(commentDiv);
                    });
                }
                loadComments();
                
                commentBox.appendChild(commentSection);

                let commentInput = document.createElement('input');
                commentInput.type = "text";
                commentInput.placeholder = "Write a comment...";
                commentInput.className = "comment-input";
                commentBox.appendChild(commentInput);

                let commentSubmit = document.createElement('button');
                commentSubmit.innerText = "Submit";
                commentSubmit.className = "comment-submit";
                commentSubmit.addEventListener('click', async () => {
                    const commentText = commentInput.value.trim();
                    if (commentText === "") {
                        alert("Comment cannot be empty.");
                        return;
                    }

                    const userRef = doc(db, "users", auth.currentUser.uid);
                    const snapshot = await getDoc(userRef);
                    const userData = snapshot.data();

                    const firstName = userData.firstName || "Unknown";
                    const middleInit = userData.middleInitial ? `${userData.middleInitial}.` : "";
                    const lastName = userData.lastName || "User";
                    const fullName = `${firstName} ${middleInit} ${lastName}`;

                    const commentData = {
                        name: fullName,
                        text: commentText,
                        createdAt: Timestamp.now()
                    };
                    const docRef = doc(db, "announcements", msgData.id);
                    await updateDoc(docRef, { comments: arrayUnion(commentData) });
                    commentInput.value = "";
                    commentPost.innerHTML = "";
                    loadComments();
                });
                commentBox.appendChild(commentSubmit);

                document.body.appendChild(overlay);
                
            });
            newText.appendChild(newImg);
            
            newDiv.appendChild(newText);

            base.appendChild(newDiv);
            updateVote(msgData.id);
        }

        msgDB.forEach(msgRow => {
            createDiv(msgRow);
        });

        let newText = document.createElement('p');
        newText.className = "endMessage";
        newText.innerText = "Looks like you have reached the end";
        base.appendChild(newText);

        const userRole = sessionStorage.getItem('userRole');
        console.log("User role:", userRole);

        async function newDoc(myNum) {
            let temp = "";
            switch (myNum%3) {
                case 0:
                    temp = "urgent";
                    break;
                case 1:
                    temp = "complaint";
                    break;
                case 2: 
                    temp = "inform"; 
                    break;
            }
            const docRef = await addDoc(collection(db, "feed"), {
                title: `Announcement ${myNum}`,
                content: `This is the content of announcement ${myNum}.`,
                votes: myNum,
                voters: [],
                comments: [],
                tag: temp,
                createdAt: Timestamp.now()
            });
        }

        for (let i = 0; i <= 5; i++) {
            //newDoc(i);
        }
        
    </script>
    
    <script src="js/main.js"></script>
    <script type="module" src="js/authorization.js"></script>
</body>
</html>
